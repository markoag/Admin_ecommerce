<div class="card">
  <!--begin::Card body-->
  <span
    class="spinner-border spinner-border-sm align-middle ms-2"
    *ngIf="isLoading$ | async"
  ></span>
  <div class="card-body border-top p-9">
    <div class="row mb-6">
      <div class="col-lg-8 fv-row fv-plugins-icon-container">
        <label class="fw-semibold fs-6 py-2">Título:</label>
        <input
          type="text"
          name="title"
          [(ngModel)]="title"
          disabled="true"
          class="form-control form-control-lg form-control-solid"
          placeholder="Laptop HP 15.6"
        />
      </div>
      <div class="col-lg-4 fv-row fv-plugins-icon-container">
        <label class="fw-semibold fs-6 py-2">Sku:</label>
        <input
          type="text"
          name="sku"
          [(ngModel)]="sku"
          disabled="true"
          class="form-control form-control-lg form-control-solid"
          placeholder="P000001"
        />
      </div>
    </div>
    <div class="row mb-6 align-items-center">
      <div class="col-6">
        <label class="fw-semibold fs-6 py-2">Variaciones:</label>
        <div class="row">
          <div class="col-12">
            <!-- Formularios -->
            <div class="row align-items-center">
              <div class="col-4">
                <div class="row">
                  <div class="col-12">
                    <label class="fw-semibold fs-6 py-2 required"
                      >Atributos:</label
                    >
                    <select
                      class="form-control form-select-solid fw-bolder"
                      name="departament"
                      [(ngModel)]="variations_attribute_id"
                      placeholder="Selec. Atributo"
                    >
                      <option value="">--Seleccionar--</option>
                      <ng-container *ngFor="let item of attributes">
                        <option [value]="item.id">{{ item.name }}</option>
                      </ng-container>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="fw-semibold fs-6 py-2 required">Campo:</label>
                    <ng-container *ngIf="type_attribute_variation == 3">
                      <!-- Seleccionable -->
                      <select
                        class="form-control form-select-solid fw-bolder"
                        name="departament"
                        [(ngModel)]="campo_v1"
                      >
                        <option value="">--Seleccionar--</option>
                        <!-- <ng-container *ngFor="let item of attributes">
                            <option [value]="item.id">{{ item.name }}</option>
                          </ng-container> -->
                      </select>
                    </ng-container>
                    <ng-container *ngIf="type_attribute_variation == 4">
                      <!-- Multiseleccion -->
                      <ng-multiselect-dropdown
                        [placeholder]="'Selecciona tus etiquetas'"
                        [settings]="dropdownSettings"
                        [data]="dropdownListVariations"
                        [(ngModel)]="selectedItemsVariations"
                        (onSelect)="onItemSelect($event)"
                        (onSelectAll)="onSelectAll($event)"
                      >
                      </ng-multiselect-dropdown>
                    </ng-container>
                  </div>
                </div>
              </div>

              <div class="col-4">
                <div class="row">
                  <div class="col-12">
                    <label class="fw-semibold fs-6 py-2">Agg Precio:</label>
                    <input
                      type="number"
                      name="price_variation"
                      [(ngModel)]="price_variation"
                      class="form-control form-control-lg form-control-solid"
                      placeholder="10"
                    />
                  </div>
                  <div class="col-12">
                    <label class="fw-semibold fs-6 py-2 required"
                      >Agg Stock:</label
                    >
                    <input
                      type="number"
                      name="stock_variation"
                      [(ngModel)]="stock_variation"
                      class="form-control form-control-lg form-control-solid"
                      placeholder="50"
                    />
                  </div>
                </div>
              </div>
              <div class="col-4">
                <button
                  class="btn btn-primary btn-sm mt-10"
                  ngbTooltip="Agregar Variación"
                >
                  +
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <label class="fw-semibold fs-6 py-2">Especificaciones:</label>
        <div class="row">
          <div class="col-12">
            <!-- Formularios -->
            <div class="row align-items-center">
              <div class="col-4">
                <label class="fw-semibold fs-6 py-2 required">Atributos:</label>
                <select
                  class="form-control form-select-solid fw-bolder"
                  name="departament"
                  [(ngModel)]="specification_attribute_id"
                  placeholder="Selec. Atributo"
                  (change)="changeSpecifications()"
                >
                  <option value="">--Seleccionar--</option>
                  <ng-container *ngFor="let item of attributes_specifications">
                    <option [value]="item.id">{{ item.name }}</option>
                  </ng-container>
                </select>
              </div>
              <div class="col-4">
                <label class="fw-semibold fs-6 py-2 required">Campo:</label>
                <ng-container *ngIf="type_attribute_specification == 1">
                  <!-- Texto -->
                  <input
                    type="text"
                    name="value"
                    [(ngModel)]="value"
                    class="form-control form-control-lg form-control-solid"
                    placeholder="Laptop HP 15.6"
                  />
                </ng-container>
                <ng-container *ngIf="type_attribute_specification == 2">
                  <!-- Número -->
                  <input
                    type="number"
                    name="value"
                    [(ngModel)]="value"
                    class="form-control form-control-lg form-control-solid"
                    placeholder="1234567890"
                  />
                </ng-container>
                <ng-container *ngIf="type_attribute_specification == 3">
                  <!-- Seleccionable -->
                  <select
                    class="form-control form-select-solid fw-bolder"
                    name="departament"
                    [(ngModel)]="propertie_id"
                  >
                    <option value="">--Seleccionar--</option>
                    <ng-container *ngFor="let item of properties">
                      <option [value]="item.id">{{ item.name }}</option>
                    </ng-container>
                  </select>
                </ng-container>
                <ng-container *ngIf="type_attribute_specification == 4">
                  <!-- Multiseleccion -->
                  <ng-multiselect-dropdown
                    [placeholder]="'Selecciona tus etiquetas'"
                    [settings]="dropdownSettings"
                    [data]="dropdownList"
                    [(ngModel)]="selectedItems"
                    (onSelect)="onItemSelect($event)"
                    (onSelectAll)="onSelectAll($event)"
                  >
                  </ng-multiselect-dropdown>
                </ng-container>
              </div>
              <div class="col-4">
                <button
                  class="btn btn-primary btn-sm mt-10"
                  ngbTooltip="Agregar Especificacón"
                  (click)="save()"
                >
                  +
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="row">
          <div class="col-12">
            <!-- Tabla de las variaciones seleccionadas para el producto -->
            <div class="table-responsive">
              <table class="table align-middle gs-0 gy-4">
                <thead>
                  <tr class="fw-bold text-muted bg-light">
                    <th class="ps-4 min-w-325px rounded-start">Product</th>
                    <th class="min-w-125px">Price</th>
                    <th class="min-w-200px text-end rounded-end"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <div class="d-flex align-items-center">
                        <div class="symbol symbol-50px me-5">
                          <img src="" class="" alt="" />
                        </div>

                        <div class="d-flex justify-content-start flex-column">
                          <a
                            href="#"
                            class="text-gray-900 fw-bold text-hover-primary mb-1 fs-6"
                            >Sant Extreanet Solution</a
                          >
                          <span
                            class="text-muted fw-semibold text-muted d-block fs-7"
                            >HTML, JS, ReactJS</span
                          >
                        </div>
                      </div>
                    </td>

                    <td>
                      <a
                        href="#"
                        class="text-gray-900 fw-bold text-hover-primary d-block mb-1 fs-6"
                        >$2,790</a
                      >
                      <span
                        class="text-muted fw-semibold text-muted d-block fs-7"
                        >Paid</span
                      >
                    </td>

                    <td class="text-end">
                      <a
                        href="#"
                        class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                      >
                        <i class="ki-duotone ki-switch fs-2"
                          ><span class="path1"></span><span class="path2"></span
                        ></i>
                      </a>

                      <a
                        href="#"
                        class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                      >
                        <i class="ki-duotone ki-pencil fs-2"
                          ><span class="path1"></span><span class="path2"></span
                        ></i>
                      </a>

                      <a
                        href="#"
                        class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm"
                      >
                        <i class="ki-duotone ki-trash fs-2"
                          ><span class="path1"></span><span class="path2"></span
                          ><span class="path3"></span><span class="path4"></span
                          ><span class="path5"></span
                        ></i>
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="row">
          <div class="col-12">
            <!-- Tabla de las especificaciones seleccionadas para el producto -->
            <div class="table-responsive">
              <table class="table align-middle gs-0 gy-4">
                <thead>
                  <tr class="fw-bold text-muted bg-light">
                    <th class="ps-4 min-w-325px rounded-start">Atributo E.</th>
                    <th class="min-w-125px">Valor</th>
                    <th class="min-w-200px text-end rounded-end"></th>
                  </tr>
                </thead>
                <tbody>
                  <ng-container *ngFor="let specification of specifications">
                    <tr>
                      <td>
                        <div class="d-flex align-items-center">
                          <div class="symbol symbol-50px me-2">
                            <span class="symbol-label">
                              <i class="ki-duotone ki-colors-square text-gray-900 fs-2tx"
                                ><span class="path1"></span
                                ><span class="path2"></span
                                ><span class="path3"></span
                                ><span class="path4"></span
                              ></i>
                            </span>
                          </div>

                          <div class="d-flex justify-content-start flex-column">
                            <a
                              href="#"
                              class="text-gray-900 fw-bold text-hover-primary mb-1 fs-6"
                              >{{ specification.attribute.name }}</a
                            >
                            <!-- <span
                              class="text-muted fw-semibold text-muted d-block fs-7"
                              >HTML, JS, ReactJS</span
                            > -->
                          </div>
                        </div>
                      </td>

                      <td>
                        <a
                          href="#"
                          onclick="return false;"
                          class="text-gray-900 fw-bold text-hover-primary d-block mb-1 fs-6"
                          >{{ getValueAttribute(specification) }}</a
                        >
                        <!-- <span
                          class="text-muted fw-semibold text-muted d-block fs-7"
                          >Paid</span
                        > -->
                      </td>

                      <td class="text-end">
                        <a
                          href="#"
                          onclick="return false;"
                          (click)="editSpecification(specification)"
                          class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1"
                        >
                          <i class="ki-duotone ki-pencil fs-2"
                            ><span class="path1"></span
                            ><span class="path2"></span
                          ></i>
                        </a>

                        <a
                          href="#"
                          onclick="return false;"
                          (click)="deleteSpecification(specification)"
                          class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm"
                        >
                          <i class="ki-duotone ki-trash fs-2"
                            ><span class="path1"></span
                            ><span class="path2"></span
                            ><span class="path3"></span
                            ><span class="path4"></span
                            ><span class="path5"></span
                          ></i>
                        </a>
                      </td>
                    </tr>
                  </ng-container>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
