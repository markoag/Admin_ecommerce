<div class="card">
  <span
    class="spinner-border spinner-border-sm align-middle ms-2"
    *ngIf="isLoading$ | async"
  ></span>
  <div class="card-body border-top p-9">
    <div class="row mb-6">
      <div class="col-4">
        <label
          class="btn btn-outline btn-outline-dashed btn-outline-default d-flex text-start p-6"
          [ngClass]="{ active: type_categorie == 1 }"
          t-button="true"
        >
          <span
            class="form-check form-check-custom form-check-solid form-check-sm align-items-start mt-1"
          >
            <input
              class="form-check-input"
              type="radio"
              (click)="changeTypeCategorie(1)"
              name="usage"
              value="1"
              [checked]="type_categorie == 1"
            />
          </span>
          <span class="ms-5">
            <span class="fs-6 fw-bolder mb-1 d-block">Departamento</span>
            <small>Primer Nivel</small>
          </span>
        </label>
      </div>
      <div class="col-4">
        <label
          class="btn btn-outline btn-outline-dashed btn-outline-default d-flex text-start p-6"
          [ngClass]="{ active: type_categorie == 2 }"
          data-kt-button="true"
        >
          <span
            class="form-check form-check-custom form-check-solid form-check-sm align-items-start mt-1"
          >
            <input
              class="form-check-input"
              type="radio"
              (click)="changeTypeCategorie(2)"
              name="usage"
              value="2"
              [checked]="type_categorie == 2"
            />
          </span>
          <span class="ms-5">
            <span class="fs-6 fw-bolder mb-1 d-block">Categoría</span>
            <small>Segundo Nivel</small>
          </span>
        </label>
      </div>
      <div class="col-4">
        <label
          class="btn btn-outline btn-outline-dashed btn-outline-default d-flex text-start p-6"
          [ngClass]="{ active: type_categorie == 3 }"
          data-kt-button="true"
        >
          <span
            class="form-check form-check-custom form-check-solid form-check-sm align-items-start mt-1"
          >
            <input
              class="form-check-input"
              type="radio"
              (click)="changeTypeCategorie(3)"
              name="usage"
              value="3"
              [checked]="type_categorie == 3"
            />
          </span>
          <span class="ms-5">
            <span class="fs-6 fw-bolder mb-1 d-block">Subcategoría</span>
            <small>Tercer Nivel</small>
          </span>
        </label>
      </div>
    </div>

    <div class="row mb-6">
      <div class="col-lg-4 fv-row fv-plugins-icon-container">
        <label class="fw-semibold fs-6 py-2">Nombre: (*)</label>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="name"
          class="form-control form-control-lg form-control-solid"
          placeholder="Ej: Computadoras"
        />
      </div>
      <div class="col-lg-4 fv-row fv-plugins-icon-container">
        <label class="fw-semibold fs-6 py-2"
          >Ícono: ( {{ type_categorie == 1 ? "*" : "Opcional" }} )</label
        >
        <input
          type="text"
          name="icon"
          [(ngModel)]="icon"
          class="form-control form-control-lg form-control-solid"
          placeholder="Ej: flaticon2-layers"
        />
      </div>
    </div>
    <div class="row mb-6">
      <div class="col-lg-4 col-md-4 col-sm-12 my-2">
        <label class="form-label"
          >Sube tu imagen: (
          {{ type_categorie == 1 ? "*" : "Opcional" }} )</label
        >
        <div class="custom-file">
          <input
            type="file"
            class="custom-file-input"
            id="customFile"
            accept=".jpeg, .bmp, .jpg, .png, .gif, .webp"
            (change)="processFile($event)"
          />
          <label class="custom-file-label" for="customFile">Choose file</label>
        </div>
        <div class="">
          <img class="img py-4" [src]="img_preview" width="200" alt="" />
        </div>
      </div>
      <div class="col-lg-4 fv-row fv-plugins-icon-container">
        <label class="fw-semibold fs-6 py-2">Posición: (*)</label>
        <input
          type="number"
          name="position"
          [(ngModel)]="position"
          class="form-control form-control-lg form-control-solid"
          placeholder="Ej: 5"
        />
      </div>
      <div class="col-lg-4">
        <label class="fw-semibold fs-6 py-2">Estado:(*)</label>
        <select
          class="form-control form-select-solid fw-bolder"
          name="state"
          [(ngModel)]="state"
          placeholder="Selec. el estado"
        >
          <option value="1">Activo</option>
          <option value="2">Inactivo</option>
        </select>
      </div>
    </div>
    <div class="row mb-6" *ngIf="type_categorie != 1">
      <div class="col-lg-6 col-md-6 col-sm-12 my-2" *ngIf="type_categorie == 2">
        <label class="fw-semibold fs-6 py-2"
          >Departamento:(Primer Nivel *)</label
        >
        <select
          class="form-control form-select-solid fw-bolder"
          name="departament"
          [(ngModel)]="categorie_second_id"
          placeholder="Selec. Departamento"
        >
          <option value="">--Seleccionar--</option>
          <ng-container *ngFor="let item of categories_first">
            <option [value]="item.id">{{ item.name }}</option>
          </ng-container>
        </select>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12 my-2" *ngIf="type_categorie == 3">
        <label class="fw-semibold fs-6 py-2"
          >Departamento:(Primer Nivel *)</label
        >
        <select
          class="form-control form-select-solid fw-bolder"
          name="departament"
          [(ngModel)]="categorie_third_id"
          (change)="changeDepartament()"
          placeholder="Selec. Departamento"
        >
          <option value="">--Seleccionar--</option>
          <ng-container *ngFor="let item of categories_first">
            <option [value]="item.id">{{ item.name }}</option>
          </ng-container>
        </select>
      </div>
      <div class="col-lg-6 col-md-6 col-sm-12 my-2" *ngIf="type_categorie == 3">
        <label class="fw-semibold fs-6 py-2">Categoría:(Segundo Nivel *)</label>
        <select
          class="form-control form-select-solid fw-bolder"
          name="categorie"
          [(ngModel)]="categorie_second_id"
          placeholder="Selec. Categoría"
        >
          <option value="">--Seleccionar--</option>
          <ng-container *ngFor="let item of categories_seconds_backups">
            <option [value]="item.id">{{ item.name }}</option>
          </ng-container>
        </select>
      </div>
    </div>

    <div>
      <div class="col-3">
        <button class="btn btn-primary" (click)="save()">Actualizar</button>
      </div>
    </div>
  </div>
</div>
